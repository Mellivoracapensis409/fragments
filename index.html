<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fragments — énigme fossile</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@700;800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light dark;
--bg:light-dark(#ecd8bf,#1a120f);
--ink:light-dark(#2a1610,#f2e4d2);
--soft:light-dark(#6b4a3a,#bfa28d);
--panel:light-dark(#f6e9d7,#261a15);
--line:light-dark(#d3b89b,#3d2b23);
--oxide:#7a2f1d;
--bone:#ecdfc6;
--accent:#14b1c4;
--accent-ink:light-dark(#0b6f7c,#5fd6e4);
--good:light-dark(#2f7a46,#6fd08d);
--bad:light-dark(#b23a22,#ff8a6e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Public Sans",system-ui,sans-serif;overflow-x:clip}
button,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
header{background:var(--oxide);color:var(--bone);position:relative;padding:12px max(4vw,16px) 22px}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:10px;background:linear-gradient(180deg,#a8452b 0 25%,#8e8a80 25% 45%,#c46a3f 45% 62%,#6f5d55 62% 80%,#d79b6a 80%)}
.top{max-width:1240px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px;margin-right:auto}
.brand h1{font:800 40px/1 "Big Shoulders Stencil Display",Impact,sans-serif;margin:0;letter-spacing:.01em}
.brand span{font-size:14px;opacity:.85}
.modes{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid rgba(236,223,198,.45);background:transparent;color:var(--bone);border-radius:999px;padding:0 14px;min-height:42px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed=true]{background:var(--bone);color:var(--oxide);border-color:var(--bone);font-weight:600}
.chip[disabled]{opacity:.55;cursor:default}
.chip small{font-size:12px;opacity:.8}
.icon-btn{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:10px;border:1px solid rgba(236,223,198,.45);background:rgba(0,0,0,.15);color:var(--bone);cursor:pointer;font-size:14px;white-space:nowrap}
.icon-btn svg{width:20px;height:20px}
@media(max-width:1320px){.brand span{display:none}}
main{max-width:1240px;margin:0 auto;padding:16px max(4vw,16px) 40px;display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:18px 22px;align-items:start}
.subbar{grid-column:1/-1;display:flex;align-items:center;gap:10px 18px;flex-wrap:wrap}
.subbar .info{display:flex;gap:16px;flex-wrap:wrap;font-weight:600}
.subbar .info span{white-space:nowrap;display:inline-block}
.subbar .info small{font-weight:500;color:var(--soft)}
.levels{display:flex;margin-left:auto;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--panel)}
.levels button{border:0;background:transparent;border-radius:999px;min-height:38px;padding:0 14px;cursor:pointer;font-size:14px;color:var(--soft);white-space:nowrap}
.levels button[aria-pressed=true]{background:var(--oxide);color:var(--bone);font-weight:600}
.levels[hidden]{display:none}
.stage{position:relative;border-radius:16px;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#3a2820 0,#22160f 70%,#1a100b 100%);box-shadow:0 18px 40px -20px rgba(40,15,5,.6),inset 0 0 0 1px rgba(255,255,255,.05);aspect-ratio:8/5.4;touch-action:none;user-select:none}
.stage::before{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,230,200,.07) 1px,transparent 1.4px),radial-gradient(rgba(0,0,0,.25) 1px,transparent 1.6px);background-size:7px 7px,11px 11px;background-position:0 0,3px 5px;pointer-events:none;z-index:1}
.ph{position:absolute;inset:0;display:grid;place-items:center;padding:56px 14px 64px}.ph img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 12px 22px rgba(0,0,0,.55));user-select:none;-webkit-user-drag:none}.ph .cap{position:absolute;right:14px;top:16px;max-width:40%;font-size:11px;line-height:1.3;color:#d8c9b4;background:rgba(20,10,6,.6);padding:3px 8px;border-radius:6px;text-align:right}.ph.hero{padding:0}.ph.hero img{width:100%;height:100%;border-radius:0;box-shadow:none}.ph.hero .cap{top:auto;bottom:10px}@media(max-width:600px){.ph{padding:52px 8px 60px}.ph .cap{display:none}}
.grid{position:absolute;inset:0;z-index:3;pointer-events:none}
.viewport{position:absolute;inset:0;overflow:hidden;z-index:2;cursor:zoom-in}
.viewport.zoomed{cursor:grab}.viewport.dragging{cursor:grabbing}
.zoomable{position:absolute;inset:0;transform-origin:0 0;will-change:transform}
.layer{position:absolute;inset:0}
.layer svg{width:100%;height:100%;display:block}
.layer.enter{animation:dig 1.1s cubic-bezier(.2,.7,.2,1) both}
.layer.leave{animation:fade .6s ease both}
@keyframes dig{0%{clip-path:circle(0% at 50% 48%);filter:brightness(1.8) blur(3px)}60%{filter:brightness(1.1) blur(0)}100%{clip-path:circle(85% at 50% 48%);filter:none}}
@keyframes fade{to{opacity:0}}
.dust{position:absolute;inset:0;z-index:4;pointer-events:none;width:100%;height:100%}
.hud{position:absolute;z-index:5;display:flex;gap:8px;align-items:center}
.hud.tl{top:12px;left:12px;right:12px;flex-wrap:wrap}.hud.br{bottom:12px;right:12px}.hud.bl{bottom:12px;left:12px}
.tag{display:inline-flex;align-items:center;gap:6px;background:rgba(20,10,6,.72);color:var(--bone);border-radius:8px;padding:5px 10px;font-size:13px;backdrop-filter:blur(4px);border:1px solid rgba(236,223,198,.18)}
.tag b{font-weight:700}
.cert{display:inline-flex;align-items:center;gap:6px}.cert::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--bone);flex:none}
.cert.estimation::before{background:var(--accent)}
.cert.observe::before{background:transparent;border:2px solid currentColor;width:7px;height:7px}.levels button:disabled{opacity:.35;cursor:default}.cert.hypothese::before{background:transparent;border:2px dashed #f2b24c;width:7px;height:7px}
.zbtn{width:44px;height:44px;border-radius:10px;border:1px solid rgba(236,223,198,.25);background:rgba(20,10,6,.72);color:var(--bone);font-size:22px;line-height:1;cursor:pointer;backdrop-filter:blur(4px)}
.zbtn.small{font-size:13px;width:auto;padding:0 12px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:grid;gap:18px}
.step-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.step-head .n{font-size:14px;color:var(--soft)}
.pts{font:800 34px/1 "Big Shoulders Stencil Display",Impact,sans-serif;color:var(--accent-ink);white-space:nowrap}
.pts small{font:500 13px "Public Sans",sans-serif;color:var(--soft)}
#clueTitle{font:800 32px/1.05 "Big Shoulders Stencil Display",Impact,sans-serif;margin:4px 0 0;text-wrap:balance}
#clueText{margin:6px 0 0}
.track{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;list-style:none;margin:0;padding:0}
.track button{width:100%;min-height:52px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;display:grid;place-items:center;padding:4px 2px;font-size:12px;color:var(--soft)}
.track button b{font-size:15px;color:var(--ink)}
.track button.done{background:light-dark(#eedbc2,#30211a)}
.track button.current{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.track button.viewing{background:var(--oxide);color:var(--bone);border-color:var(--oxide)}
.track button.viewing b{color:var(--bone)}
.track button.locked{cursor:default;opacity:.55;border-style:dashed}
.combo{position:relative}
.combo label{display:block;font-weight:600;margin-bottom:6px}
.combo input{width:100%;min-height:50px;font-size:17px;padding:0 14px 0 44px;border-radius:12px;border:1.5px solid var(--line);background:light-dark(#fffaf2,#1d1410);color:var(--ink)}
.combo input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent)}
.combo input:disabled{opacity:.5}
.combo .mag{position:absolute;left:14px;bottom:15px;width:20px;height:20px;color:var(--soft)}
#sugg{position:absolute;left:0;right:0;top:100%;margin:6px 0 0;padding:6px;list-style:none;background:light-dark(#fffaf2,#221813);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 30px -12px rgba(0,0,0,.35);z-index:20;max-height:260px;overflow:auto}
#sugg[hidden]{display:none}
#sugg li{padding:10px 12px;border-radius:8px;cursor:pointer;min-height:44px;display:flex;align-items:center}
#sugg li[aria-selected=true]{background:light-dark(#e6f6f8,#14353a)}
#sugg li.tried{opacity:.45;text-decoration:line-through;cursor:default}
#sugg .empty{color:var(--soft);cursor:default}
.actions{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:10px}
.btn{min-height:50px;border-radius:12px;border:0;font-weight:700;font-size:16px;cursor:pointer;padding:0 14px}
.btn.primary{background:var(--oxide);color:var(--bone)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.ghost small{display:block;font-weight:500;font-size:12px;color:var(--soft)}
.feedback{min-height:24px;margin:0;font-size:15px}
.feedback.bad{color:var(--bad)}.feedback.good{color:var(--good)}
.tried-list{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}
.tried-list:empty{display:none}
.tried-list li{font-size:13px;padding:3px 10px;border-radius:999px;background:light-dark(#f3d9cf,#3a1f18);color:var(--bad);text-decoration:line-through}
.legend{font-size:13px;color:var(--soft);display:flex;gap:6px 14px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .cert::before,.unknown .cert::before{border:1px solid var(--soft)}
#fiche{position:fixed;inset:0;z-index:50;background:rgba(15,7,4,.6);backdrop-filter:blur(6px);display:grid;place-items:start center;overflow:auto;padding:24px 12px}
#fiche[hidden]{display:none}
.sheet{width:min(980px,100%);background:var(--panel);border-radius:18px;overflow:hidden;border:1px solid var(--line);animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{transform:translateY(30px);opacity:0}}
.sheet-hero{position:relative;background:radial-gradient(120% 90% at 50% 40%,#3a2820 0,#1d120c 100%);aspect-ratio:8/4.6}
.sheet-hero svg{width:100%;height:100%;display:block}
.result{position:absolute;left:16px;top:16px;right:16px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.sheet-body{padding:clamp(18px,3vw,34px);display:grid;gap:26px}
.sheet h2{font:800 52px/1 "Big Shoulders Stencil Display",Impact,sans-serif;margin:0}
.sheet h2 + p{margin:6px 0 0;color:var(--soft)}
.sheet h3{font:800 26px/1.1 "Big Shoulders Stencil Display",Impact,sans-serif;margin:0 0 10px}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:0}
.facts div{border-top:2px solid var(--oxide);padding-top:8px}
.facts dt{font-size:13px;color:var(--soft)}
.facts dd{margin:2px 0 0;font-weight:600}
.cols{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px}
.side{display:grid;gap:24px;align-content:start}
.why{list-style:none;margin:0;padding:0;display:grid;gap:12px}
.why li{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px}
.why li i{font:800 22px/34px "Big Shoulders Stencil Display",sans-serif;text-align:center;background:var(--oxide);color:var(--bone);border-radius:8px;height:34px}
.why li.hit i{background:var(--accent);color:#06343a}
.why li strong{display:block}
.unknown{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.unknown li{padding:10px 12px;border-radius:10px;border:1px dashed var(--line)}
.unknown li b{display:flex;align-items:center;gap:8px}
.listen{margin-top:8px;min-height:44px;border-radius:10px;border:1.5px solid var(--accent);background:transparent;color:var(--accent-ink);font-weight:600;padding:0 14px;cursor:pointer}
.confus{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.confus li{padding:8px 0;border-bottom:1px solid var(--line)}
.confus li.mine strong::after{content:" · ta proposition";color:var(--bad);font-weight:500;font-size:13px}
.sources{font-size:14px;margin:0;padding-left:18px;color:var(--soft)}
.sources a{color:var(--accent-ink)}
.sheet-actions{display:flex;gap:10px;flex-wrap:wrap}
.sheet-actions .btn{flex:1 1 200px}
.note{font-size:13px;color:var(--soft);margin:0}
.recap{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.recap li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.recap .dots{display:flex;gap:4px}
.recap .dots i{width:14px;height:14px;border-radius:3px;background:var(--line)}
.recap .dots i.w{background:#c46a3f}.recap .dots i.g{background:var(--accent)}
.recap b{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right;min-width:60px}
.big{font:800 64px/1 "Big Shoulders Stencil Display",Impact,sans-serif;color:var(--accent-ink)}
.bilan{padding:clamp(20px,4vw,40px);display:grid;gap:22px}
@media(max-width:900px){main{grid-template-columns:minmax(0,1fr)}.facts{grid-template-columns:repeat(2,minmax(0,1fr))}.cols{grid-template-columns:minmax(0,1fr)}.levels{margin-left:0}}
@media(max-width:600px){header{padding-bottom:18px}.brand h1{font-size:34px}.modes{order:3;width:100%;overflow-x:auto;flex-wrap:nowrap}main{padding-top:12px;gap:12px}.stage{aspect-ratio:4/3.4;border-radius:12px}.hud.bl{display:none}.panel{padding:16px}.sheet h2{font-size:40px}.sheet-hero{aspect-ratio:8/5.4}#clueTitle{font-size:28px}.levels{width:100%}.levels button{flex:1;padding:0 6px}}
.glow{position:absolute;inset:0;z-index:6;pointer-events:none;border-radius:inherit}
.glow.bad{animation:gbad .8s ease-out}
.glow.good{animation:ggood 1.4s ease-out}
@keyframes gbad{0%{box-shadow:inset 0 0 0 4px #ff6a4d,inset 0 0 80px rgba(255,90,60,.45)}100%{box-shadow:inset 0 0 0 0 transparent}}
@keyframes ggood{0%{box-shadow:inset 0 0 0 4px #14b1c4,inset 0 0 110px rgba(20,177,196,.5)}100%{box-shadow:inset 0 0 0 0 transparent}}
.stage.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97)}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.txt-in{animation:txtin .5s cubic-bezier(.2,.7,.2,1) both}
#clueText.txt-in{animation-delay:.08s}
@keyframes txtin{from{opacity:0;transform:translateY(8px)}}
.pts.pop,.subbar .pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{40%{transform:scale(1.18)}}
.track button.current{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
.tried-list li{animation:txtin .35s both}
#sugg:not([hidden]){animation:txtin .18s both}
.feedback:not(:empty){animation:txtin .3s both}
.btn,.chip,.zbtn,.track button,.levels button,.icon-btn{transition:transform .12s,background-color .2s,box-shadow .2s}
.btn:active,.chip:active,.zbtn:active,.track button:active,.levels button:active,.icon-btn:active{transform:scale(.96)}
.btn.primary:not([disabled]):hover{box-shadow:0 6px 16px -6px rgba(122,47,29,.7)}
.sheet-body>*{animation:txtin .5s cubic-bezier(.2,.7,.2,1) both}
.sheet-body>*:nth-child(2){animation-delay:.08s}.sheet-body>*:nth-child(3){animation-delay:.16s}.sheet-body>*:nth-child(4){animation-delay:.24s}.sheet-body>*:nth-child(n+5){animation-delay:.3s}
.recap li{animation:txtin .4s both}.recap li:nth-child(2){animation-delay:.06s}.recap li:nth-child(3){animation-delay:.12s}.recap li:nth-child(4){animation-delay:.18s}.recap li:nth-child(5){animation-delay:.24s}.recap li:nth-child(n+6){animation-delay:.3s}
.result .tag{animation:pop .6s .3s cubic-bezier(.2,1.6,.4,1) both}
@media(prefers-reduced-motion:reduce){.glow,.stage.shake,.txt-in,.pts.pop,.subbar .pop,.track button.current,.tried-list li,#sugg,.feedback,.sheet-body>*,.recap li,.result .tag{animation:none!important}.btn:active,.chip:active,.zbtn:active{transform:none}}
@media(prefers-reduced-motion:reduce){.layer.enter,.layer.leave,.sheet{animation:none}.layer.leave{opacity:0}}
</style>
</head>
<body>
<header>
<div class="top">
<div class="brand"><h1>Fragments</h1><span>Reconnais l'animal à partir de ses restes</span></div>
<div class="modes" role="group" aria-label="Mode de jeu">
<button class="chip" data-mode="dino" aria-pressed="true">Dinosaures</button>
<button class="chip" data-mode="animal" aria-pressed="false">Animaux actuels</button>
<button class="chip" data-mode="jour" aria-pressed="false">Défi du jour</button>
</div>
<button class="icon-btn" id="soundBtn" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path id="soundWave" d="M17 9l4 6M21 9l-4 6"/></svg><span id="soundLbl">Sons activés</span></button>
</div>
</header>
<main>
<div class="subbar">
<div class="info"><span id="roundInfo">Manche 1 / 6</span><span id="scoreInfo">Score : 0</span></div>
<div class="levels" id="levels" role="group" aria-label="Niveau">
<button data-level="tous" aria-pressed="true">Tous</button>
<button data-level="celebre" aria-pressed="false">Célèbres</button>
<button data-level="inter" aria-pressed="false">Intermédiaires</button>
<button data-level="expert" aria-pressed="false">Experts</button>
</div>
</div>
<section class="stage" aria-label="Zone d'observation du fossile">
<div class="viewport" id="viewport"><div class="zoomable" id="zoomable"></div></div>
<svg class="grid" viewBox="0 0 800 540" preserveAspectRatio="none" aria-hidden="true" id="gridSvg"></svg>
<canvas class="dust" id="dust"></canvas><div class="glow" id="glow"></div>
<div class="hud tl"><span class="tag" id="stepTag">Indice 1 / 5</span><span class="tag cert" id="certTag">Établi par les fossiles</span></div>
<div class="hud bl"><span class="tag" id="zoomTag">Pince ou molette pour zoomer</span></div>
<div class="hud br"><button class="zbtn" id="zOut" aria-label="Dézoomer">−</button><button class="zbtn" id="zIn" aria-label="Zoomer">+</button><button class="zbtn small" id="zReset">1:1</button></div>
</section>
<section class="panel" aria-live="polite">
<div>
<div class="step-head"><span class="n" id="stepN">Indice 1 sur 5</span><span class="pts" id="ptsNow">100 <small>pts si tu trouves maintenant</small></span></div>
<h2 id="clueTitle">Une dent minuscule</h2>
<p id="clueText"></p>
</div>
<ol class="track" id="track" aria-label="Progression des indices"></ol>
<div class="combo">
<label for="guess">Ta réponse</label>
<svg class="mag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
<input id="guess" type="text" autocomplete="off" spellcheck="false" placeholder="Tape un nom : stego, tricé, rex…" role="combobox" aria-expanded="false" aria-controls="sugg" aria-autocomplete="list">
<ul id="sugg" role="listbox" hidden></ul>
</div>
<div class="actions">
<button class="btn primary" id="submitBtn" disabled>Proposer</button>
<button class="btn ghost" id="skipBtn"><span id="skipMain">Indice suivant</span><small id="skipSub">sans répondre</small></button>
</div>
<p class="feedback" id="feedback"></p>
<ul class="tried-list" id="tried" aria-label="Propositions écartées"></ul>
<div class="legend"><span class="cert">Établi par les fossiles</span><span class="cert estimation">Estimation</span><span class="cert hypothese">Hypothèse ou invention</span><span class="cert observe">Observé sur l'animal vivant</span></div>
</section>
</main>
<section id="fiche" hidden role="dialog" aria-modal="true" aria-labelledby="ficheName"><div class="sheet" id="sheet"></div></section>
<script>
{
const NS='http://www.w3.org/2000/svg';
const POINTS=[100,70,45,25,10];
const CERT={fossile:'Établi par les fossiles',estimation:'Estimation',hypothese:'Hypothèse ou invention',reconst:'Fossiles et parties reconstituées',observe:"Observé sur l'animal vivant"};
const LEVELS={celebre:'Célèbre',inter:'Intermédiaire',expert:'Expert'};

const SPECIES=[

const furStrokes=(seed,x,y,w,h,n,ang,len,cols,op=.5,sw=1.6)=>{const r=rng(seed);let s='';for(let i=0;i<n;i++){const px=x+r()*w,py=y+r()*h,a=ang+(r()-.5)*.6,l=len*(.6+r()*.8);s+=`<path d="M${f(px)} ${f(py)}l${f(Math.cos(a)*l)} ${f(Math.sin(a)*l)}" stroke="${cols[Math.floor(r()*cols.length)]}"/>`}return`<g stroke-width="${sw}" stroke-linecap="round" opacity="${op}">${s}</g>`};
const vband=(x,y0,y1,w,amp,ph,taper)=>{const N=12,L=[],R=[];for(let i=0;i<=N;i++){const t=i/N,y=y0+(y1-y0)*t,cx=x+Math.sin(t*3+ph)*amp,ww=w*(taper?Math.max(.12,1-t*.88):1)*(.85+.3*Math.sin(t*5+ph));L.push([cx-ww/2,y]);R.unshift([cx+ww/2,y])}return cr([...L,...R])};
const hband=(y,x0,x1,w,amp,ph)=>{const N=12,T=[],Bt=[];for(let i=0;i<=N;i++){const t=i/N,x=x0+(x1-x0)*t,cy=y+Math.sin(t*4+ph)*amp,ww=w*(.85+.3*Math.sin(t*6+ph));T.push([x,cy-ww/2]);Bt.unshift([x,cy+ww/2])}return cr([...T,...Bt])};
const tigerPat=(x0,x1,y0,y1,seed,step,w)=>{const r=rng(seed);let s='';for(let x=x0;x<x1;x+=step*(.75+r()*.5)){const len=(y1-y0)*(.45+r()*.5);s+=`<path d="${vband(x,y0-6,y0+len,w*(.7+r()*.6),step*.18,r()*6,true)}"/>`;if(r()>.6)s+=`<path d="${vband(x+step*.35,y1-len*.5,y1+6,w*.6,step*.1,r()*6,true)}" transform="rotate(180 ${f(x+step*.35)} ${f(y1-len*.25)})"/>`}return`<g fill="#1b130d">${s}</g>`};
const zebraPat=(x0,x1,y0,y1,split,seed,step,w)=>{const r=rng(seed);let v='',h='';for(let x=x0;x<x1;x+=step)v+=`<path d="${vband(x+(r()-.5)*4,y0,split+10,w*(.8+r()*.4),step*.15,r()*6,false)}"/>`;for(let y=split;y<y1;y+=step*.55)h+=`<path d="${hband(y,x0,x1,w*.5,2,r()*6)}"/>`;return`<g fill="#141414">${v}${h}</g>`};
const giraffePat=(x0,x1,y0,y1,seed,sp)=>{const r=rng(seed);let s='';let row=0;for(let y=y0;y<y1;y+=sp*.86,row++){for(let x=x0+(row%2?sp/2:0);x<x1;x+=sp){const cx=x+(r()-.5)*sp*.25,cy=y+(r()-.5)*sp*.25,pts=[];for(let k=0;k<6;k++){const a=k/6*Math.PI*2+r()*.4,rad=sp*(.36+r()*.08);pts.push([cx+Math.cos(a)*rad,cy+Math.sin(a)*rad])}s+=`<path d="${cr(pts)}"/>`}}return`<g fill="#a35a2a">${s}</g>`};
const wrinkles=(x0,x1,y0,y1,seed,n,len)=>{const r=rng(seed);let s='';for(let i=0;i<n;i++){const x=x0+r()*(x1-x0),y=y0+r()*(y1-y0),l=len*(.5+r()),a=(r()-.5)*.8;s+=`<path d="M${f(x)} ${f(y)}q${f(l/2)} ${f(-4+r()*8+a*l)} ${f(l)} ${f(a*l)}"/>`}return`<g stroke="#4a4540" stroke-width="1.6" fill="none" opacity=".6">${s}</g>`};

const OVR={"stegosaurus":{"clues":[{"art":"p:a","title":"Des côtes et une patte","text":"Des côtes larges et un membre arrière massif, sur un squelette monté. Un grand quadrupède… mais lequel ?","cert":"reconst"},{"art":"p:b","title":"Des plaques dressées","text":"Le long du dos se dressent de larges plaques osseuses. Retrouvées détachées du squelette, elles sont replacées en deux rangées alternées.","cert":"reconst"},null,{"art":"p:full","title":"Le squelette monté","text":"Le squelette presque complet surnommé « Sophie » : petite tête basse, plaques sur le dos et quatre épines au bout de la queue.","cert":"reconst"},{"art":"p:rec","title":"La reconstitution","text":"Reconstitution artistique d'après les fossiles. Les couleurs sont un choix de l'illustrateur : elles ne sont pas connues.","cert":"hypothese"}],"why":[["Les côtes et la patte","Un grand quadrupède au membre arrière massif : beaucoup de candidats possibles à ce stade."],["Les plaques","De hautes plaques osseuses en deux rangées : un stégosaure. Les ankylosaures portent des plaques plates."],["Le contexte","Jurassique supérieur et jusqu'à 9 m : Kentrosaurus et Hesperosaurus sont plus petits, Huayangosaurus plus ancien."],["Le squelette","Des plaques très larges, maximales au-dessus des hanches, et quatre épines caudales : Stegosaurus."],["La reconstitution","Le stégosaure, avec ses plaques et son « thagomizer »."]]},"tyrannosaurus":{"clues":[{"art":"p:a","title":"Un bras minuscule","text":"Sous la cage thoracique pend un bras étonnamment court, terminé par deux doigts.","cert":"reconst"},{"art":"p:b","title":"Un crâne massif","text":"Un crâne profond et large à l'arrière, armé de grosses dents épaisses.","cert":"reconst"},null,{"art":"p:full","title":"Le squelette monté","text":"Le spécimen surnommé « Tristan Otto » : un grand bipède au crâne énorme et aux pattes arrière puissantes.","cert":"reconst"},{"art":"p:rec","title":"La reconstitution","text":"Reconstitution artistique d'après les fossiles. Les couleurs sont un choix de l'illustrateur : elles ne sont pas connues.","cert":"hypothese"}],"why":[["Le bras","Deux doigts seulement : la marque des tyrannosauridés. Allosaurus et Giganotosaurus en ont trois."],["Le crâne","Large à l'arrière, avec des dents épaisses comme des bananes : un tyrannosauridé géant."],["Le contexte","68 à 66 Ma : Giganotosaurus (≈ 98 Ma) est bien trop ancien. Reste Tarbosaurus, cousin asiatique plus petit."],["Le squelette","Le plus massif des tyrannosauridés : Tyrannosaurus rex."],["La reconstitution","Le roi des lézards tyrans."]]},"triceratops":{"clues":[{"art":"p:a","title":"Des pattes robustes","text":"Des membres épais, faits pour porter un corps lourd : un grand quadrupède.","cert":"reconst"},{"art":"p:b","title":"Des cornes et une collerette","text":"Deux longues cornes au-dessus des yeux, une plus courte sur le museau, et une collerette osseuse à l'arrière du crâne.","cert":"reconst"},null,{"art":"p:full","title":"Le squelette monté","text":"Un crâne immense, près d'un tiers de la longueur du corps, et une collerette pleine, sans ouverture.","cert":"reconst"},{"art":"p:rec","title":"La reconstitution","text":"Reconstitution artistique d'après les fossiles. Les couleurs sont un choix de l'illustrateur : elles ne sont pas connues.","cert":"hypothese"}],"why":[["Les pattes","Un grand quadrupède lourd : encore beaucoup de possibilités."],["Les cornes","Trois cornes et une collerette : un cératopsidé à longues cornes frontales, comme Triceratops ou Torosaurus."],["Le contexte","68 à 66 Ma élimine Styracosaurus (≈ 75 Ma) ; Torosaurus reste possible."],["Le squelette","Collerette courte et pleine : Triceratops. Celle de Torosaurus est longue et percée de deux ouvertures."],["La reconstitution","Trois cornes, un bec et une collerette."]]},"ankylosaurus":{"clues":[{"art":"p:a","title":"Une pièce d'armure","text":"Un ostéoderme fossile : une plaque osseuse qui se trouvait dans la peau, avec une carène au centre.","cert":"fossile"},{"art":"p:b","title":"Le bout de la queue","text":"Au bout de la queue, une massue osseuse. Détail d'une reconstitution : chez Ankylosaurus, la massue n'est connue qu'en partie.","cert":"reconst"},null,{"art":"skeleton","title":"Le squelette","cert":"reconst","text":"Crâne large aux coins armés de petites cornes, corps bas et large. Le squelette n'est connu qu'en partie : le reste est complété d'après des ankylosaures proches."},{"art":"p:rec","title":"La reconstitution","text":"Reconstitution artistique d'après les fossiles. Les couleurs sont un choix de l'illustrateur : elles ne sont pas connues.","cert":"hypothese"}],"why":[["L'ostéoderme","Une plaque osseuse plate et carénée : un dinosaure cuirassé."],["La massue","Une massue caudale : les ankylosauridés, comme Ankylosaurus ou Euoplocephalus. Les nodosauridés n'en ont pas."],["Le contexte","68 à 66 Ma et jusqu'à 8 m : Euoplocephalus est plus ancien (≈ 76 Ma) et plus petit."],["Le squelette","Le plus grand ankylosauridé connu, au crâne plus large que long."],["La reconstitution","Blindage, cornes de la tête et massue."]]},"parasaurolophus":{"clues":[{"art":"p:a","title":"Une cage thoracique","text":"Des côtes longues et serrées, et des vertèbres à hautes épines : un grand herbivore. Rien de décisif encore.","cert":"reconst"},null,{"art":"p:b","title":"Une crête en tube","text":"Une longue crête creuse part de l'arrière du crâne et se courbe vers l'arrière ; le museau s'aplatit en bec.","cert":"reconst"},{"art":"p:full","title":"Le squelette exposé","text":"Squelette présenté en relief contre un mur : bec de canard, longue crête tubulaire, pattes arrière puissantes.","cert":"reconst"},{"art":"p:rec","title":"La reconstitution","text":"Reconstitution artistique d'après les fossiles. Les couleurs sont un choix de l'illustrateur : elles ne sont pas connues.","cert":"hypothese"}],"why":[["Les côtes","Un grand herbivore : à ce stade, beaucoup de candidats."],["Le contexte","76,5 à 73 Ma : l'époque des grands hadrosaures à crête."],["La crête","Un long tube creux, ni casque (Corythosaurus) ni hachette (Lambeosaurus) : Parasaurolophus."],["Le squelette","Bec de canard et crête tubulaire confirment."],["La reconstitution","Une crête qui servait sans doute à se reconnaître, et peut-être à produire des sons."]]},"diplodocus":{"clues":[{"art":"p:a","title":"Une suite de vertèbres","text":"Des vertèbres allongées s'enchaînent sur un cou interminable : un sauropode.","cert":"reconst"},{"art":"p:b","title":"Une petite tête","text":"Une tête minuscule et allongée, aux dents en crayon groupées à l'avant du museau.","cert":"reconst"},null,{"art":"p:full","title":"Le squelette monté","text":"Squelette exposé au Smithsonian, à Washington : long cou et queue en fouet encore plus longue.","cert":"reconst"},{"art":"p:rec","title":"La reconstitution","text":"Reconstitution artistique d'après les fossiles. Les couleurs sont un choix de l'illustrateur : elles ne sont pas connues.","cert":"hypothese"}],"why":[["Les vertèbres","Un cou démesuré : un sauropode."],["La tête","Des dents en crayon à l'avant du museau : un diplodocidé. Brachiosaurus a des dents en cuillère."],["Le contexte","Jurassique supérieur, 25 m mais léger : un diplodocidé élancé."],["Le squelette","Cou fin et queue en fouet : plus gracile qu'Apatosaurus, au cou moins long que Barosaurus."],["La reconstitution","Une silhouette tout en longueur."]]},"velociraptor":{"clues":[{"art":"p:a","title":"Des mains griffues","text":"Des doigts fins terminés par des griffes recourbées : un petit théropode.","cert":"reconst"},{"art":"p:b","title":"Un crâne long et bas","text":"Un crâne étroit, légèrement creusé vers le haut, aux petites dents pointues.","cert":"reconst"},null,{"art":"p:full","title":"Le squelette monté","text":"Moins de 2 m de long, une queue raidie et une griffe relevée au deuxième orteil.","cert":"reconst"},{"art":"p:rec","title":"La reconstitution","text":"Reconstitution emplumée. Les plumes des bras sont attestées par les fossiles ; leur étendue sur le corps et les couleurs sont des hypothèses.","cert":"hypothese"}],"why":[["Les mains","De longues mains griffues : un petit théropode prédateur."],["Le crâne","Long, bas et creusé : le profil d'un dromæosauridé."],["Le contexte","Moins de 2 m : Deinonychus, plus grand (≈ 3 m) et plus ancien, devient peu probable."],["Le squelette","La griffe en faucille au deuxième orteil : Velociraptor."],["La reconstitution","Bien plus petit et plus emplumé que dans les films."]]},"spinosaurus":{"clues":[{"art":"p:a","title":"Des vertèbres de queue","text":"Sur ce schéma, de longues épines hérissent la queue, au-dessus et au-dessous des vertèbres. Les couleurs indiquent de quel fossile vient chaque os.","cert":"reconst"},{"art":"p:b","title":"De très hautes épines","text":"Au-dessus du dos se dressent des épines osseuses de plus d'un mètre et demi.","cert":"reconst"},null,{"art":"p:full","title":"Le squelette reconstitué","text":"Reconstitution numérique publiée en 2022 : museau de crocodile, voile dorsale, queue haute. Chaque couleur correspond à un spécimen différent.","cert":"reconst"},{"art":"p:rec","title":"La reconstitution","text":"Reconstitution artistique, chassant un poisson-scie Onchopristis. Posture, mode de vie et couleurs restent débattus.","cert":"hypothese"}],"why":[["La queue","Une queue haute, hérissée d'épines : un animal très inhabituel."],["Les épines","Une voile dorsale géante : Spinosaurus."],["Le contexte","Baryonyx et Suchomimus, ses cousins, sont plus anciens et plus petits."],["Le squelette","Voile, museau de crocodile et queue haute : Spinosaurus."],["La reconstitution","Un des plus longs carnivores terrestres connus."]]},"pachycephalosaurus":{"clues":[{"art":"p:a","title":"Des pattes de bipède","text":"Des pattes arrière longues et fines, de petits bras : un dinosaure bipède de taille moyenne.","cert":"reconst"},{"art":"p:b","title":"Un crâne bombé","text":"Un dôme osseux épais, bordé de petites pointes et de bosses.","cert":"reconst"},null,{"art":"p:full","title":"Le squelette monté","text":"Squelette en grande partie reconstitué : de cet animal, on connaît surtout le crâne.","cert":"reconst"},{"art":"p:rec","title":"La reconstitution","text":"Reconstitution artistique d'après les fossiles. Les couleurs sont un choix de l'illustrateur : elles ne sont pas connues.","cert":"hypothese"}],"why":[["Les pattes","Un bipède de taille moyenne : beaucoup de candidats possibles."],["Le dôme","Un crâne bombé et épais : un pachycéphalosaure. La couronne de pointes désigne Pachycephalosaurus plutôt que Stegoceras."],["Le contexte","68 à 66 Ma et 4,5 m : le plus grand et l'un des derniers de son groupe."],["Le squelette","Bipède à petite tête bombée."],["La reconstitution","Un dôme impossible à confondre."]]},"brachiosaurus":{"clues":[{"art":"p:a","title":"Des os de membres","text":"Sur ce schéma, les os retrouvés sont colorés : un bras très long, un os de cuisse à peine plus court.","cert":"reconst"},{"art":"p:b","title":"Un cou dressé","text":"Un très long cou s'élève depuis des épaules plus hautes que les hanches.","cert":"reconst"},null,{"art":"p:full","title":"Le squelette reconstitué","text":"Schéma composite : en couleur, les os réellement connus ; en noir, la silhouette restituée. Les pattes avant dépassent les pattes arrière.","cert":"reconst"},{"art":"p:rec","title":"La reconstitution","text":"Reconstitution artistique d'après les fossiles. Les couleurs sont un choix de l'illustrateur : elles ne sont pas connues.","cert":"hypothese"}],"why":[["Les membres","Un humérus aussi long que le fémur : la signature des brachiosauridés."],["Le cou","Un cou dressé sur des épaules hautes : un brachiosauridé."],["Le contexte","Jurassique supérieur : reste à le départager de Giraffatitan, son cousin africain."],["Le squelette","Dos plus long et queue plus haute que chez Giraffatitan."],["La reconstitution","Une silhouette de girafe géante."]]},"allosaurus":{"clues":[{"art":"p:a","title":"Des bras griffus","text":"Des bras assez longs, terminés par trois doigts aux grandes griffes recourbées.","cert":"reconst"},{"art":"p:b","title":"Un crâne de carnivore","text":"Un crâne allongé, percé de grandes ouvertures, aux dents en lame, avec de petites cornes au-dessus des yeux.","cert":"reconst"},null,{"art":"p:full","title":"Le squelette monté","text":"Squelette exposé à l'American Museum of Natural History de New York : un grand bipède au crâne léger.","cert":"reconst"},{"art":"p:rec","title":"La reconstitution","text":"Reconstitution artistique d'après les fossiles. Les couleurs sont un choix de l'illustrateur : elles ne sont pas connues.","cert":"hypothese"}],"why":[["Les bras","Trois doigts : ni tyrannosauridé (deux doigts), ni Ceratosaurus (quatre)."],["Le crâne","Petites cornes au-dessus des yeux, pas de corne sur le museau : Allosaurus plutôt que Ceratosaurus."],["Le contexte","Jurassique supérieur : T. rex et Giganotosaurus sont bien plus récents."],["Le squelette","Le grand prédateur du Jurassique."],["La reconstitution","Le chasseur le plus commun de son époque."]]},"iguanodon":{"clues":[{"art":"p:a","title":"Des côtes et un bassin","text":"Une cage thoracique profonde et des membres robustes : un grand herbivore.","cert":"reconst"},{"art":"p:b","title":"Une main particulière","text":"Le pouce se termine en pointe conique, dressée à l'écart des autres doigts.","cert":"reconst"},null,{"art":"p:full","title":"Le squelette monté","text":"Montage historique, dans une posture dressée aujourd'hui jugée inexacte : l'animal tenait son dos plus à l'horizontale.","cert":"reconst"},{"art":"p:rec","title":"La reconstitution","text":"Reconstitution artistique d'après les fossiles. Les couleurs sont un choix de l'illustrateur : elles ne sont pas connues.","cert":"hypothese"}],"why":[["Les côtes","Un grand herbivore massif."],["Le pouce","Le pouce en pointe : la marque d'Iguanodon et de ses proches."],["Le contexte","Crétacé inférieur : les hadrosaures à crête sont bien plus récents. Reste Mantellisaurus, plus petit et plus léger."],["Le squelette","Grand, robuste, aux bras longs et puissants : Iguanodon."],["La reconstitution","Un herbivore massif, loin du « rhinocéros » imaginé au XIXe siècle."]]},"tigre":{"clues":[{"art":"track","title":"Une empreinte ronde","text":"Large d'environ 12 à 15 cm : quatre doigts arrondis, un gros coussinet à trois lobes et aucune trace de griffes, restées rentrées pendant la marche.","cert":"observe"},null,{"art":"p:a","title":"Le pelage","text":"Orangé, barré de rayures noires. Chaque individu a un motif unique.","cert":"observe"},{"art":"p:b","title":"Un détail de la tête","text":"Une tête ronde, des rayures jusque sur le front, du blanc autour des yeux et sur les joues.","cert":"observe"},{"art":"p:full","title":"L'animal","text":"Photographie d'une tigresse du Bengale.","cert":"observe"}],"why":[["L'empreinte","Quatre doigts sans griffes et un coussinet trilobé : un félin, et un grand."],["Le contexte","L'Asie écarte le jaguar, américain. En Asie, seuls le tigre, le léopard et une petite population de lions sont aussi grands."],["Le pelage","Le seul félin rayé : léopard et jaguar portent des rosettes, le guépard des taches pleines."],["La tête","Rayures noires sur fond orangé et blanc : le tigre."],["L'animal","Le tigre."]]},"zebre":{"clues":[{"art":"track","title":"Un sabot unique","text":"Arrondi à l'avant, d'une dizaine de centimètres : un seul doigt porte tout le poids. C'est la marque des équidés.","cert":"observe"},null,{"art":"p:a","title":"Le pelage","text":"Des rayures noires et blanches larges, qui descendent jusque sous le ventre.","cert":"observe"},{"art":"p:b","title":"Un détail de la tête","text":"Un museau sombre, de longues oreilles, une crinière dressée et rayée.","cert":"observe"},{"art":"p:full","title":"L'animal","text":"Photographie d'un zèbre des plaines en Namibie.","cert":"observe"}],"why":[["Le sabot","Un seul doigt : un équidé (cheval, âne ou zèbre)."],["Le contexte","La savane africaine écarte le cheval de Przewalski, qui vit en Mongolie."],["Le pelage","Rayures larges jusque sous le ventre : zèbre des plaines. Le zèbre de Grévy a des rayures fines et un ventre blanc."],["La tête","Crinière dressée et rayée : un zèbre."],["L'animal","Le zèbre des plaines."]]},"girafe":{"clues":[{"art":"track","title":"Un sabot fendu","text":"Deux moitiés allongées, sur près de 25 à 30 cm : l'empreinte d'un très grand animal à sabots fendus.","cert":"observe"},{"art":"p:a","title":"Le pelage","text":"De grandes taches brunes séparées par un réseau de lignes claires. Chaque individu a un motif unique.","cert":"observe"},null,{"art":"p:b","title":"Un détail de la tête","text":"Deux petites cornes couvertes de peau, les ossicônes, et de grandes oreilles.","cert":"observe"},{"art":"p:full","title":"L'animal","text":"Photographie d'une girafe dans le Serengeti, en Tanzanie.","cert":"observe"}],"why":[["L'empreinte","Un sabot fendu et très grand : un grand mammifère à sabots fendus."],["Le pelage","Des taches en réseau : la girafe. L'okapi, son seul cousin actuel, a un pelage sombre et des pattes rayées."],["Le contexte","Plus de 5 m de haut et des feuilles d'arbres au menu."],["La tête","Les ossicônes : la girafe ou l'okapi, et seule la girafe a ce pelage."],["L'animal","La girafe."]]},"panda":{"clues":[{"art":"p:a","title":"La fourrure","text":"Épaisse et dense, d'un blanc crème qui bascule brusquement vers le noir.","cert":"observe"},{"art":"pandaPaw","title":"Une patte avant","text":"Cinq doigts griffus… et un sixième « doigt » : un os du poignet allongé, qui aide à saisir les tiges.","cert":"observe"},null,{"art":"p:b","title":"Un détail de la tête","text":"Une tête ronde, des oreilles noires et de grandes taches noires autour des yeux.","cert":"observe"},{"art":"p:full","title":"L'animal","text":"Photographie d'un panda géant.","cert":"observe"}],"why":[["La fourrure","De grands aplats noirs et blancs."],["La patte","Le faux pouce existe chez deux mangeurs de bambou : le panda géant et le panda roux."],["Le contexte","Une taille d'ours écarte le panda roux, pas plus grand qu'un chat."],["La tête","Les taches noires autour des yeux : le panda géant."],["L'animal","Le panda géant."]]},"elephant":{"clues":[{"art":"p:a","title":"La peau","text":"Grise, épaisse, profondément ridée et presque sans poils.","cert":"observe"},{"art":"track","title":"Une empreinte ronde","text":"Presque ronde, de 40 à 50 cm, sillonnée de craquelures, avec de petites marques d'ongles à l'avant.","cert":"observe"},null,{"art":"p:b","title":"Une oreille","text":"Une oreille immense, aux bords repliés, qui couvre l'épaule.","cert":"observe"},{"art":"p:full","title":"L'animal","text":"Photographie d'un éléphant mâle dans le parc d'Etosha, en Namibie.","cert":"observe"}],"why":[["La peau","Ridée et presque nue : éléphant, rhinocéros ou hippopotame."],["L'empreinte","Ronde et immense : un éléphant."],["Le contexte","La savane africaine écarte l'éléphant d'Asie et l'éléphant de forêt."],["L'oreille","Une oreille immense : un éléphant d'Afrique. Celle de l'éléphant d'Asie est bien plus petite."],["L'animal","L'éléphant de savane d'Afrique."]]},"loup":{"clues":[{"art":"p:a","title":"Le pelage","text":"Des poils mêlés de gris, de fauve et de crème, sur une épaisse sous-couche.","cert":"observe"},{"art":"track","title":"Une empreinte ovale","text":"Environ 10 à 12 cm de long : quatre doigts marqués de griffes et un coussinet triangulaire.","cert":"observe"},null,{"art":"p:b","title":"Un détail de la tête","text":"Des oreilles dressées, un museau allongé, des yeux clairs et un masque plus pâle autour de la gueule.","cert":"observe"},{"art":"p:full","title":"L'animal","text":"Photographie d'un loup d'Eurasie dans la neige.","cert":"observe"}],"why":[["Le pelage","Gris-fauve mêlé : loup, coyote, chacal ou certains chiens."],["L'empreinte","Griffes visibles et coussinet triangulaire : un canidé, plus grand que le renard et le chacal."],["Le contexte","Chasse en meute, hurlement, hémisphère Nord : le loup."],["La tête","Un grand canidé sauvage au masque clair."],["L'animal","Le loup gris."]]}};
ROUNDS.push({"answer":"ratel","cat":"animal","level":"inter","ctx":{"biome":"savane","region":"Afrique, péninsule Arabique, Iran et Inde : savanes, forêts, zones arides","cri":"grognements et cliquetis rauques","len":[0.6,1],"lenLabel":"≈ 1 m queue comprise","sizeTitle":"Longueur","diet":"meat","dietLabel":"petits animaux, larves, miel, fruits"},"clues":[{"art":"p:a","title":"Le pelage","cert":"observe","text":"Un manteau de poils gris clair, nettement séparé d'un pelage noir."},{"art":"p:b","title":"Une patte avant","cert":"observe","text":"Courte et massive, armée de griffes d'environ 4 cm, faites pour creuser."},{"art":"context","title":"Son monde","cert":"observe","text":"Savanes, forêts et zones arides d'Afrique, jusqu'à la péninsule Arabique et l'Inde. Environ 1 m queue comprise. Omnivore : petits animaux, serpents, insectes, larves d'abeilles, fruits."},{"art":"p:c","title":"Un détail de la tête","cert":"observe","text":"Une tête large au museau noir, coiffée du manteau clair, aux oreilles minuscules."},{"art":"p:full","title":"L'animal","cert":"observe","text":"Photographie d'un ratel."}],"sheet":{"latin":"Mellivora capensis","meaning":"« Mangeur de miel » du Cap.","facts":[["Où","Afrique, péninsule Arabique, Iran, Inde"],["Taille","≈ 23 à 28 cm au garrot, ≈ 1 m queue comprise"],["Régime","Omnivore"],["Statut UICN","Préoccupation mineure (en déclin)"]],"why":[["Le pelage","Dessus clair, dessous noir : ratel ou mouffette. Le blaireau européen a la tête rayée de noir et de blanc."],["Les griffes","De longues griffes de fouisseur : un mustélidé comme le ratel, le blaireau ou le glouton."],["Le contexte","L'Afrique et l'Asie du Sud-Ouest écartent le glouton, du Grand Nord, et la mouffette rayée, américaine."],["La tête","Large, au museau noir sous un manteau clair : le ratel."],["L'animal","Le ratel, ou blaireau à miel."]],"unkTitle":"Bon à savoir","unknown":[["observe","Une peau épaisse et lâche","Épaisse de 6 à 8 mm, elle lui permet de se retourner pour mordre lorsqu'il est saisi."],["estimation","Plus fort qu'un lion ?","Non : sa réputation d'animal intrépide a nourri des exagérations. Il est lui-même la proie des lions et des léopards."]],"confusions":{"blaireau":"Blaireau européen : tête rayée de noir et de blanc, vit en Europe et dans une partie de l'Asie.","glouton":"Grand mustélidé brun des forêts et toundras du Grand Nord.","mouffette":"Mouffette rayée : petite, avec deux bandes blanches, en Amérique du Nord."},"fun":"Son nom de ratel viendrait des cliquetis rauques qu'il émet lorsqu'il est menacé.","sources":[["National Geographic : le ratel","https://www.nationalgeographic.com/animals/mammals/facts/honey-badger"],["IFAW : le ratel","https://www.ifaw.org/animals/honey-badgers"]]}});

 pointe."},"fun":"Plusieurs « momies » d'Edmontosaurus ont conservé l'empreinte de leur peau.","sources":[["Natural History Museum, Dino Directory : Edmontosaurus","https://www.nhm.ac.uk/discover/dino-directory/edmontosaurus.html"],["National Geographic (2013) : la crête de chair d'Edmontosaurus","https://www.nationalgeographic.com/science/article/surpise-well-studied-dinosaur-actually-had-a-cocks-comb"]]}},{"answer":"compsognathus","level":"inter","cat":"dino","ctx":{"from":152,"to":148,"ma":"≈ 150 Ma","env":"Milieu : îles et lagunes chaudes","len":[1,1.25],"lenLabel":"≈ 1 m, queue comprise","diet":"meat","dietLabel":"petits lézards, insectes"},"clues":[{"art":"p:a","title":"Une longue queue","text":"Une queue fine et très longue sur une dalle de calcaire : un petit animal.","cert":"reconst"},{"art":"p:b","title":"Une petite tête","text":"Un crâne minuscule et allongé, sur un cou fin et souple.","cert":"reconst"},{"art":"context","title":"Son monde","cert":"estimation","text":"Jurassique supérieur, il y a environ 150 millions d'années, sur des îles bordées de lagunes. Environ 1 m de long, queue comprise. Petit carnivore."},{"art":"p:full","title":"Le fossile entier","text":"Un petit squelette complet de bipède, cou rejeté en arrière, sur une dalle de calcaire.","cert":"reconst"},{"art":"p:rec","title":"La reconstitution","text":"Reconstitution avec un plumage simple inspiré de proches parents. Les couleurs sont inventées.","cert":"hypothese"}],"sheet":{"latin":"Compsognathus longipes","meaning":"« Mâchoire élégante ».","facts":[["Période","Jurassique supérieur, ≈ 150 Ma"],["Lieu","Allemagne et sud-est de la France"],["Taille","≈ 1 m"],["Régime","Carnivore"]],"why":[["La queue","Un petit animal à longue queue."],["La tête","Un petit théropode."],["Le contexte","Jurassique supérieur d'Europe, comme Archaeopteryx."],["Le fossile","Un petit carnivore sans plumes d'ailes : Compsognathus."],["La reconstitution","Un petit chasseur de lézards."]],"unknown":[["estimation","Avait-il des plumes ?","Aucune plume n'est conservée sur ses fossiles, mais ses proches parents en portaient."],["hypothese","Ses couleurs","Aucune couleur n'est connue."]],"confusions":{"archaeopteryx":"Même époque et même région, mais avec de vraies ailes à plumes.","microraptor":"Plus récent, à quatre ailes, en Chine.","velociraptor":"Bien plus grand, avec une griffe en faucille."},"fun":"L'un des deux squelettes connus, trouvé près de Nice, a un petit lézard dans l'estomac.","sources":[["Natural History Museum, Dino Directory : Compsognathus","https://www.nhm.ac.uk/discover/dino-directory/compsognathus.html"]]}},{"answer":"baryonyx","level":"inter","cat":"dino","ctx":{"from":130,"to":125,"ma":"≈ 130–125 Ma","env":"Milieu : plaines marécageuses et rivières","len":[7.5,10],"lenLabel":"≈ 7,5 à 10 m","diet":"fish","dietLabel":"poissons surtout"},"clues":[{"art":"p:a","title":"Un dos de prédateur","text":"Des vertèbres hautes et de longues côtes : un grand carnivore.","cert":"reconst"},{"art":"p:b","title":"Une griffe géante","text":"Le premier doigt de la main porte une griffe d'environ 30 cm.","cert":"reconst"},{"art":"context","title":"Son monde","cert":"estimation","text":"Crétacé inférieur, il y a environ 130 à 125 millions d'années, au bord des rivières. Environ 7,5 à 10 m de long. Mangeur de poissons."},{"art":"p:full","title":"Le squelette monté","text":"Long museau étroit de crocodile et grande griffe au pouce.","cert":"reconst"},{"art":"p:rec","title":"La reconstitution","text":"Reconstitution artistique d'après les fossiles. Les couleurs sont un choix de l'illustrateur : elles ne sont pas connues.","cert":"hypothese"}],"sheet":{"latin":"Baryonyx walkeri","meaning":"« Griffe lourde ».","facts":[["Période","Crétacé inférieur, ≈ 130–125 Ma"],["Lieu","Angleterre"],["Taille","≈ 7,5 à 10 m"],["Régime","Poissons surtout"]],"why":[["Le dos","Un grand carnivore."],["La griffe","Une griffe énorme au pouce : un spinosauridé."],["Le contexte","Crétacé inférieur : plus ancien que Spinosaurus."],["Le squelette","Museau de crocodile et pas de grande voile : Baryonyx."],["La reconstitution","Un pêcheur des rivières."]],"unknown":[["fossile","Un repas conservé","Des écailles de poisson retrouvées dans son estomac ont prouvé pour la première fois qu'un théropode mangeait du poisson."],["hypothese","Ses couleurs","Aucune couleur n'est connue."]],"confusions":{"spinosaurus":"Plus récent, plus grand, avec une grande voile dorsale.","suchomimus":"Cousin du Niger, un peu plus récent, à crête basse.","allosaurus":"Plus ancien, museau court, dents en lame."},"fun":"Sa griffe a été trouvée en 1983 par un plombier collectionneur de fossiles.","sources":[["Natural History Museum, Dino Directory : Baryonyx","https://www.nhm.ac.uk/discover/dino-directory/baryonyx.html"]]}},{"answer":"therizinosaurus","level":"expert","cat":"dino","ctx":{"from":71,"to":69,"ma":"≈ 70 Ma","env":"Milieu : rivières et forêts du Crétacé supérieur","len":[9,10],"lenLabel":"≈ 9 à 10 m","diet":"high","dietLabel":"feuillage, probablement"},"clues":[{"art":"p:a","title":"Des os de bras","text":"Des os de bras longs et robustes : un animal de grande taille.","cert":"reconst"},{"art":"p:b","title":"Une griffe géante","text":"Une griffe en lame de faux de plus de 50 cm : la plus longue de tous les animaux terrestres connus.","cert":"reconst"},{"art":"context","title":"Son monde","cert":"estimation","text":"Crétacé supérieur, il y a environ 70 millions d'années. Environ 9 à 10 m de long et peut-être plus de 5 tonnes. Probablement herbivore."},{"art":"p:full","title":"Les bras connus","text":"Ces bras géants sont l'essentiel de ce que l'on connaît de l'animal : le reste du corps est reconstitué d'après ses proches.","cert":"reconst"},{"art":"p:rec","title":"La reconstitution","text":"Reconstitution d'après des parents mieux connus : cou long, ventre large, plumes probables. Couleurs inventées.","cert":"hypothese"}],"sheet":{"latin":"Therizinosaurus cheloniformis","meaning":"« Lézard faucheur ».","facts":[["Période","Crétacé supérieur, ≈ 70 Ma"],["Lieu","Mongolie (désert de Gobi)"],["Taille","≈ 9 à 10 m"],["Régime","Herbivore probable"]],"why":[["Les bras","Un grand animal aux bras puissants."],["La griffe","Une griffe de plus de 50 cm : Therizinosaurus."],["Le contexte","Fin du Crétacé, en Mongolie."],["Les bras","Connu surtout par ses bras : le reste vient de ses proches."],["La reconstitution","Un géant herbivore descendu des carnivores."]],"unknown":[["estimation","À quoi servaient ses griffes ?","Tirer les branches, se défendre, parader ? Trop fragiles pour creuser, elles restent mystérieuses."],["estimation","Herbivore ?","Sa famille avait des dents de mangeur de plantes, mais son propre crâne n'est pas connu."],["hypothese","Ses couleurs","Aucune couleur n'est connue."]],"confusions":{"deinocheirus":"Même région et même époque, bras de 2,4 m mais griffes bien plus courtes.","baryonyx":"Grande griffe au pouce, mais bien plus petite, et museau de crocodile.","gallimimus":"Dinosaure-autruche élancé aux bras courts."},"fun":"Quand on a découvert ses griffes en 1948, on a d'abord cru qu'elles appartenaient à une tortue géante.","sources":[["Natural History Museum, Dino Directory : Therizinosaurus","https://www.nhm.ac.uk/discover/dino-directory/therizinosaurus.html"]]}},{"answer":"microraptor","level":"expert","cat":"dino","ctx":{"from":125,"to":120,"ma":"≈ 125–120 Ma","env":"Milieu : forêts au bord de lacs volcaniques","len":[0.7,0.9],"lenLabel":"≈ 80 cm","diet":"meat","dietLabel":"petits animaux, poissons"},"clues":[{"art":"p:a","title":"Des pattes emplumées","text":"De longues plumes partent des pattes arrière, pas seulement des bras.","cert":"fossile"},{"art":"p:b","title":"Des plumes conservées","text":"Autour du squelette, l'empreinte de plumes longues et serrées.","cert":"fossile"},{"art":"context","title":"Son monde","cert":"estimation","text":"Crétacé inférieur, il y a environ 125 à 120 millions d'années, dans des forêts au bord d $('clueTitle').textContent=c.title;$('clueText').textContent=c.text;$('stepN').textContent=over?`Indice ${i+1} sur 5 · manche terminée`:i===step?`Indice ${i+1} sur 5`:`Tu revois l'indice ${i+1} · actuel : ${step+1}`;if(anim){puff();sfx('brush');['clueTitle','clueText'].forEach(k=>{const e=$(k);e.classList.remove('txt-in');void e.offsetWidth;e.classList.add('txt-in')})}};

const total=()=>results.reduce((s,r)=>s+r.pts,0);
const renderTop=()=>{if(mode==='jour'){$('roundInfo').innerHTML=`Défi du ${new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long'})} <small>· identique pour tous</small>`;$('scoreInfo').textContent=`${round.cat==='animal'?'Animal actuel':'Dinosaure'} · ${LEVELS[round.level]}`}else{$('roundInfo').innerHTML=`Manche ${qi+1} / ${queue.length} <small>· ${LEVELS[round.level]}</small>`;$('scoreInfo').textContent=`Score : ${total()} pts`}$('levels').hidden=mode==='jour';document.querySelectorAll('#levels button').forEach(b=>{b.disabled=b.dataset.level!=='tous'&&!ROUNDS.some(r=>r.cat===mode&&r.level===b.dataset.level)})};
const renderTrack=()=>{$('track').innerHTML=round.clues.map((c,i)=>{const cls=[i<step?'done':'',i===step&&!over?'current':'',i===view?'viewing':'',i>step?'locked':''].join(' ');return`<li><button class="${cls}" data-i="${i}" ${i>step?'aria-disabled="true"':''} aria-label="Indice ${i+1}, ${POINTS[i]} points"><b>${i+1}</b>${POINTS[i]} pts</button></li>`}).join('');
const res=results[results.length-1];$('ptsNow').innerHTML=over?`${res&&res.id===round.answer?res.pts:0} <small>pts sur cette manche</small>`:`${POINTS[step]} <small>pts si tu trouves maintenant</small>`;
$('skipMain').textContent=over?'Voir la fiche':step===4?'Révéler la réponse':'Indice suivant';$('skipSub').textContent=over?'et la suite':step===4?'0 point':`la bonne réponse vaudra ${POINTS[step+1]} pts`;
$('tried').innerHTML=tried.map(id=>`<li>${byId[id].name}</li>`).join('');$('guess').disabled=over;$('submitBtn').disabled=over||!sel;bumpPts()};
let lastPts=null;const bumpPts=()=>{const el=$('ptsNow');const n=parseInt(el.textContent,10);if(lastPts!==null&&lastPts!==n&&!reduce){const small=el.querySelector('small').outerHTML,from=lastPts,t0=performance.now();const f=t=>{const k=Math.min(1,(t-t0)/450);el.innerHTML=Math.round(from+(n-from)*(1-(1-k)**3))+' '+small;if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f);el.classList.remove('pop');void el.offsetWidth;el.classList.add('pop')}lastPts=n};
const flash=k=>{const g=$('glow');g.className='glow';void g.offsetWidth;g.className='glow '+k;if(k==='bad'){const st=document.querySelector('.stage');st.classList.remove('shake');void st.offsetWidth;st.classList.add('shake')}};
$('track').onclick=e=>{const b=e.target.closest('button');if(!b)return;const i=+b.dataset.i;if(i>step||i===view)return;view=i;show(i,false);renderTrack()};

const startRound=r=>{round=r;Object.values(IMG[r.answer]||{}).forEach(u=>{const i=new Image();i.src=u});$('guess').placeholder=r.cat==='animal'?'Tape un nom : tigre, loup, girafe…':'Tape un nom : stego, tricé, rex…';step=0;view=0;over=false;tried=[];sel=null;$('guess').value='';fb('');closeS();show(0,true);renderTrack();renderTop()};
const advance=()=>{if(step<4){step++;view=step;show(step,true);renderTrack()}else finish(false)};

const suggest=()=>{const q=norm($('guess').value);sel=null;$('submitBtn').disabled=true;if(!q){list=[];closeS();return}list=SPECIES.filter(s=>(s.cat||'dino')===round.cat).map(s=>{const keys=[s.name,...s.alias].map(norm);let sc=99;keys.forEach((k,ki)=>{if(k===q)sc=Math.min(sc,-1);else if(k.startsWith(q))sc=Math.min(sc,ki?.5:0);else if(k.includes(q))sc=Math.min(sc,1);else if(q.length>=3){const d=Math.min(...[-1,0,1].map(o=>lev(q,k.slice(0,q.length+o))));if(d<=(q.length>5?2:1))sc=Math.min(sc,2+d)}});return{s,sc}}).filter(o=>o.sc<99).sort((a,b)=>a.sc-b.sc||a.s.name.localeCompare(b.s.name)).slice(0,7).map(o=>o.s);hi=list.findIndex(s=>!tried.includes(s.id));renderS()};
const renderS=()=>{const ul=$('sugg');ul.innerHTML=list.length?list.map((s,i)=>`<li role="option" id="opt-${s.id}" data-id="${s.id}" aria-selected="${i===hi}" class="${tried.includes(s.id)?'tried':''}">${s.name}</li>`).join(''):'<li class="empty">Aucun animal de la liste ne correspond</li>';ul.hidden=false;$('guess').setAttribute('aria-expanded','true');if(hi>=0)$('guess').setAttribute('aria-activedescendant','opt-'+list[hi].id);const ex=list.find(s=>[s.name,...s.alias].some(k=>norm(k)===norm($('guess').value))&&!tried.includes(s.id));if(ex){sel=ex.id;$('submitBtn').disabled=false}};
const closeS=()=>{$('sugg').hidden=true;$('guess').setAttribute('aria-expanded','false');$('guess').removeAttribute('aria-activedescendant')};
const pick=id=>{if(tried.includes(id))return;sfx('tick');sel=id;$('guess').value=byId[id].name;closeS();$('submitBtn').disabled=false;$('submitBtn').focus()};
$('guess').addEventListener('input',suggest);$('guess').addEventListener('focus',()=>{if($('guess').value&&!sel)suggest()});
$('guess').addEventListener('keydown',e=>{if($('sugg').hidden&&e.key!=='Enter')return;if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!list.length)return;let n=hi;do{n=(n+(e.key==='ArrowDown'?1:-1)+list.length)%list.length}while(tried.includes(list[n].id)&&n!==hi);hi=n;renderS()}else if(e.key==='Enter'){e.preventDefault();if(!$('sugg').hidden&&hi>=0&&list[hi])pick(list[hi].id);else if(sel)submit()}else if(e.key==='Escape')closeS()});
$('sugg').addEventListener('pointerdown',e=>{const li=e.target.closest('li[data-id]');if(li){e.preventDefault();pick(li.dataset.id)}});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.combo'))closeS()});

const fb=(t,c)=>{const p=$('feedback');p.textContent=t;p.className='feedback '+(c||'')};
const submit=()=>{if(over||!sel)return;const id=sel;sel=null;$('guess').value='';$('submitBtn').disabled=true;if(id===round.answer){fb(`Bravo, c'est bien ${byId[id].name} ! +${POINTS[step]} pts`,'good');sfx('good');flash('good');puff('gold');finish(true)}else{tried.push(id);sfx('bad');flash('bad');fb(step<4?`Ce n'est pas ${byId[id].name}. Un nouvel indice se dévoile…`:`Ce n'est pas ${byId[id].name}.`,'bad');advance()}};
$('submitBtn').onclick=submit;
$('skipBtn').onclick=()=>{if(over){openSheet();return}fb('');sfx('skip');advance()};

const dayKey=()=>{const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
const dailyIndex=()=>{const d=new Date();const n=Math.floor(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/864e5);const perm=[...ROUNDS.keys()].sort((a,b)=>((a*7919+13)%101)-((b*7919+13)%101));return perm[n%ROUNDS.length]};

const finish=won=>{const at=step;over=true;if(!won){sfx('lose');flash('bad')}else{const si=$('scoreInfo');si.classList.remove('pop');void si.offsetWidth;si.classList.add('pop')}const res={id:round.answer,won,pts:won?POINTS[at]:0,step:at,tried:[...tried]};results.push(res);if(mode==='jour')store.set('fragments-jour-'+dayKey(),res);step=4;view=4;show(4,true);renderTrack();renderTop();setTimeout(openSheet,reduce?100:1300)};

const shareLine=r=>{let s='';for(let i=0;i<5;i++)s+=i<r.step?'🟥':i===r.step&&r.won?'🟩':r.won?'⬜':'🟥';return s};
const copy=async(text,btn)=>{try{await navigator.clipboard.writeText(text);btn.textContent='Copié !'}catch(e){btn.textContent='Copie impossible ici'}};

const openSheet=()=>{const S=round.sheet,sp=byId[round.answer],res=results[results.length-1]||{won:false,pts:0,step:4,tried:[]};const tri=res.tried||[];const conf=[...new Set([...tri,...Object.keys(S.confusions)])];const last=mode!=='jour'&&qi>=queue.length-1;
$('sheet').innerHTML=`<div class="sheet-hero">${fullArt(round)}<div class="result"><span class="tag">${res.won?`Trouvé à l'indice ${res.step+1} · <b>${res.pts} pts</b>`:'Pas trouvé cette fois'}</span><span class="tag">Niveau : ${LEVELS[round.level]}</span></div></div>
<div class="sheet-body"><div><h2 id="ficheName">${sp.name}</h2><p><em>${S.latin}</em> · ${S.meaning}</p></div>
<dl class="facts">${S.facts.map(x=>`<div><dt>${x[0]}</dt><dd>${x[1]}</dd></div>`).join('')}</dl>
<div class="cols"><div><h3>Les détails qui le trahissaient</h3><ol class="why">${S.why.map((w,i)=>`<li class="${res.won&&i===res.step?'hit':''}"><i>${i+1}</i><div><strong>${w[0]}</strong>${w[1]}</div></li>`).join('')}</ol></div>
<div class="side"><div><h3>${S.unkTitle||"Ce que l'on ignore"}</h3><ul class="unknown">${S.unknown.map(u=>`<li><b><span class="cert ${u[0]}"></span>${u[1]}</b>${u[2]}${u[3]?'<br><button class="listen" id="listenBtn">Écouter une évocation inventée</button>':''}</li>`).join('')}</ul></div>
<div><h3>À ne pas confondre</h3><ul class="confus">${conf.map(id=>`<li class="${tri.includes(id)?'mine':''}"><strong>${byId[id].name}</strong> — ${S.confusions[id]||byId[id].info}</li>`).join('')}</ul></div></div></div>
<p class="note">Le saviez-vous ? ${S.fun}</p>
<div><h3>Sources</h3><ol class="sources">${S.sources.map(s=>`<li><a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a></li>`).join('')}</ol></div>
<div><h3>Crédits des images</h3><ul class="sources">${(CREDITS[round.answer]||[]).map(c=>`<li><a href="${c.url}" target="_blank" rel="noopener">${c.title}</a> · ${c.author} · <a href="${c.licenseUrl}" target="_blank" rel="noopener">${c.license}</a></li>`).join('')}</ul><p class="note">Images recadrées et redimensionnées pour le jeu ; chaque adaptation reste sous la licence de l'image d'origine.</p></div>
<div class="sheet-actions">${mode==='jour'?`<button class="btn primary" id="copyBtn">Copier mon résultat</button><button class="btn ghost" id="toFree">Jouer une partie libre</button>`:last?`<button class="btn primary" id="nextBtn">Voir le bilan</button>`:`<button class="btn primary" id="nextBtn">Manche suivante</button>`}<button class="btn ghost" id="closeSheet">Revoir les indices</button></div>
<p class="note">Photos et reconstitutions : Wikimedia Commons, voir les crédits. Empreintes, schémas de contexte et squelette d'Ankylosaurus dessinés pour le jeu.</p></div>`;
$('fiche').hidden=false;$('sheet').parentElement.scrollTop=0;
$('closeSheet').onclick=()=>{$('fiche').hidden=true};
if($('listenBtn'))$('listenBtn').onclick=evoke;
if($('nextBtn'))$('nextBtn').onclick=()=>{if(last)openBilan();else{qi++;$('fiche').hidden=true;startRound(ROUNDS[queue[qi]])}};
if($('copyBtn'))$('copyBtn').onclick=e=>copy(`Fragments · défi du ${new Date().toLocaleDateString('fr-FR')}\n${shareLine(res)} ${res.won?`trouvé à l'indice ${res.step+1}, ${res.pts} pts`:'pas trouvé'}`,e.currentTarget);
if($('toFree'))$('toFree').onclick=()=>setMode('dino');
($('nextBtn')||$('copyBtn')).focus()};

const openBilan=()=>{sfx('fanfare');const t=total(),max=queue.length*100;$('sheet').innerHTML=`<div class="bilan"><div><h2 id="ficheName">Bilan de la partie</h2><p class="note">${queue.length} manches · niveau ${level==='tous'?'tous':LEVELS[level].toLowerCase()}</p></div><div><span class="big">${t}</span> <span class="note">pts sur ${max} possibles</span></div><ul class="recap">${results.map(r=>`<li><span><strong>${byId[r.id].name}</strong><br><span class="note">${r.won?`trouvé à l'indice ${r.step+1}`:'pas trouvé'}</span></span><span class="dots">${[0,1,2,3,4].map(i=>`<i class="${i<r.step||(!r.won&&i<=r.step)?'w':i===r.step&&r.won?'g':''}"></i>`).join('')}</span><b>${r.pts} pts</b></li>`).join('')}</ul><div class="sheet-actions"><button class="btn primary" id="again">Nouvelle partie</button><button class="btn ghost" id="copyAll">Copier le bilan</button></div></div>`;
$('fiche').hidden=false;$('again').focus();$('again').onclick=()=>{$('fiche').hidden=true;newGame()};$('copyAll').onclick=e=>copy(`Fragments · partie libre : ${t} pts\n`+results.map(r=>`${shareLine(r)} ${byId[r.id].name}`).join('\n'),e.currentTarget)};

$('fiche').addEventListener('click',e=>{if(e.target.id==='fiche')$('fiche').hidden=true});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('fiche').hidden)$('fiche').hidden=true});

const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const newGame=()=>{results=[];qi=0;queue=shuffle([...ROUNDS.keys()].filter(i=>ROUNDS[i].cat===mode&&(level==='tous'||ROUNDS[i].level===level)));if(!queue.length)queue=shuffle([...ROUNDS.keys()].filter(i=>ROUNDS[i].cat===mode));startRound(ROUNDS[queue[0]])};
const setMode=m=>{mode=m;$('fiche').hidden=true;document.querySelectorAll('.chip[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===m));if(m!=='jour'){if(level!=='tous'&&!ROUNDS.some(r=>r.cat===m&&r.level===level)){level='tous';document.querySelectorAll('#levels button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.level==='tous'))}newGame();return}results=[];const r=ROUNDS[dailyIndex()];const saved=store.get('fragments-jour-'+dayKey());startRound(r);if(saved&&saved.id===r.answer){results=[saved];tried=saved.tried||[];over=true;step=4;view=4;show(4,false);renderTrack();renderTop();fb(saved.won?`Défi déjà relevé aujourd'hui : ${saved.pts} pts. Nouveau défi demain.`:"Défi déjà joué aujourd'hui. Nouveau défi demain.",saved.won?'good':'')}};
document.querySelectorAll('.chip[data-mode]').forEach(b=>b.onclick=()=>{if(b.getAttribute('aria-pressed')!=='true')setMode(b.dataset.mode)});
document.querySelectorAll('#levels button').forEach(b=>b.onclick=()=>{level=b.dataset.level;document.querySelectorAll('#levels button').forEach(x=>x.setAttribute('aria-pressed',x===b));newGame()});

newGame();
}
</script>
</body>
</html>
